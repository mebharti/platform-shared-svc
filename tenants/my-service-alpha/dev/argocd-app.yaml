apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tenant-my-service-alpha-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: 'https://github.com/mebharti/platform-shared-svc.git'
    targetRevision: HEAD
    path: 'tenants/my-service-alpha/dev'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: tenant-my-service-alpha-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
